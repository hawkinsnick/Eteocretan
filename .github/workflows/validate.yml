name: Validate source-attributed corpus
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python scripts/release_check.py
      - name: Rebuild source-derived artifacts
        run: |
          python -m corpuskit build
          python -m corpuskit export --output exports
          git diff --exit-code -- data/records.json analysis/current-status.json exports
      - run: python scripts/build_review_dossier.py --check
      - run: python scripts/audit_praisos_identity.py --check
      - run: python scripts/audit_praisos_layout_units.py --check
      - run: python scripts/audit_guarducci_route.py --check
      - run: python scripts/audit_praisos_guarducci_numbers.py --check
      - run: python scripts/audit_dreros_context.py --check
      - name: Validate Linear A method-parity controls
        run: |
          python scripts/test_preexpert_parity.py
          python scripts/build_corpus_browser.py
          test -s workbench/corpus-browser.html
          python scripts/research_api.py records --text Praisos --limit 2 > /tmp/ecr-api.json
          python scripts/export_research_layer.py json /tmp/ecr.json
          test -s /tmp/ecr.json.manifest.json
